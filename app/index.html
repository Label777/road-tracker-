<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Учёт поездок на работу: время, расходы, пересадки, контролёры.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Road Tracker">
  <title>Road Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/ui/main.js"></script>
</head>
<body>
  <main>
    <!-- Скелет на время загрузки базы -->
    <div class="stack" aria-hidden="true" style="padding-top:var(--s-6)">
      <div class="skeleton" style="width:40%;height:14px"></div>
      <div class="skeleton" style="width:70%;height:34px"></div>
      <div class="skeleton" style="width:220px;height:220px;border-radius:50%;margin:var(--s-6) auto"></div>
      <div class="skeleton" style="height:140px"></div>
    </div>
    <span class="sr-only">Загрузка…</span>
  </main>
  <nav class="tabs" aria-label="Разделы"></nav>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Для работы Road Tracker нужен JavaScript.</noscript>
</body>
</html>

# XcodeGen: `brew install xcodegen && xcodegen generate` → RoadTracker.xcodeproj
name: RoadTracker
options:
  bundleIdPrefix: ua.roadtracker
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  xcodeVersion: "16.3"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  RoadTrackerCore:
    path: Packages/RoadTrackerCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"

targets:
  RoadTracker:
    type: application
    platform: iOS
    sources:
      - path: RoadTracker
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: RoadTrackerCore
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.roadtracker.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: RoadTracker/Info.plist
      properties:
        CFBundleDisplayName: Road Tracker
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        # Значения подставляются из Config/Secrets.xcconfig (не хранится в git)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # Тексты запросов разрешений — объясняют назначение (этап 3 запрашивает их постепенно)
        NSLocationWhenInUseUsageDescription: "Геолокация нужна только во время поездки: чтобы записать маршрут, расстояние и время в пути."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Фоновый доступ позволяет продолжать запись начатой поездки при заблокированном экране и замечать выход из геозоны «Дом» или «Работа». Вне поездок координаты не сохраняются."
        NSMotionUsageDescription: "Данные о движении помогают отличить начало поездки от прогулки и экономить батарею."
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [ua.roadtracker.app.sync]

  RoadTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RoadTrackerTests]
    dependencies:
      - target: RoadTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RoadTracker:
    build:
      targets:
        RoadTracker: all
        RoadTrackerTests: [test]
    test:
      targets: [RoadTrackerTests]
      gatherCoverageData: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Логика, хранилище, синхронизация (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты
        working-directory: app
        run: node --test tests/*.test.js
      - name: Оффлайн-кэш актуален (sw.js пересобран после изменений)
        working-directory: app
        run: |
          scripts/build-sw.sh
          git diff --exit-code sw.js || { echo "Запустите app/scripts/build-sw.sh и закоммитьте sw.js"; exit 1; }
      - name: Размер сайта
        working-directory: app
        run: |
          size=$(du -cb index.html styles.css sw.js manifest.webmanifest src vendor | tail -1 | cut -f1)
          echo "Сайт целиком: $((size / 1024)) КБ"
          test "$size" -lt 1048576 || { echo "Больше 1 МБ — проверьте, что попало в app/"; exit 1; }

  e2e:
    name: Сайт в настоящем Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сквозные проверки
        working-directory: app
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 1
          SHOTS_DIR=../screenshots node tests/e2e/smoke.mjs "$(command -v google-chrome)"
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  webkit:
    name: Сайт в WebKit (движок Safari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установить Playwright и WebKit
        working-directory: app
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps webkit
      - name: Сквозные проверки в WebKit
        working-directory: app
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 1
          node tests/e2e/webkit.mjs
      - name: Скриншот ошибки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-failure
          path: app/webkit-failure.png
          if-no-files-found: ignore

  database:
    name: Схема Supabase (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
      - name: Тесты схемы и RLS
        run: supabase/tests/run_local.sh

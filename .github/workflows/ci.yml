name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Логика, хранилище, синхронизация (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты
        working-directory: app
        run: node --test tests/*.test.js

  e2e:
    name: Сайт в настоящем Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сквозные проверки
        working-directory: app
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 1
          SHOTS_DIR=../screenshots node tests/e2e/smoke.mjs "$(command -v google-chrome)"
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  database:
    name: Схема Supabase (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
      - name: Тесты схемы и RLS
        run: supabase/tests/run_local.sh
